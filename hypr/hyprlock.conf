# Tela de bloqueio: wallpaper desfocado, campo de senha e relógio central.
# Paleta Catppuccin Macchiato, mesma usada no resto dos dotfiles.

background {
    monitor =
    path = ~/.config/hypr/wallpaper_01.jpg
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    outer_color = rgb(c6a0f6)
    inner_color = rgb(24273a)
    font_color = rgb(cad3f5)
    fade_on_empty = true
    placeholder_text = <span foreground="##cad3f5">Senha...</span>
    hide_input = false
    # mostra o motivo da falha do PAM (ex.: conta bloqueada pelo faillock)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_color = rgb(ed8796)
    check_color = rgb(eed49f)
    # borda muda de cor com Caps Lock e/ou Num Lock ligados
    capslock_color = rgb(f5a97f)
    numlock_color = rgb(8aadf4)
    bothlock_color = rgb(ee99a0)
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(cad3f5)
    font_size = 64
    font_family = GeistMono Nerd Font Mono
    position = 0, 160
    halign = center
    valign = center
}
