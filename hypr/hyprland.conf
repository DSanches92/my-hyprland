# hyprland.conf — configuração principal do Hyprland

$mainMod = SUPER
$term = alacritty

#-------------------------------------------------------------------
# Monitor
#-------------------------------------------------------------------
monitor = HDMI-A-1,2560x1080@75,0x0,1
# fallback caso o nome acima não bata com nenhum monitor conectado:
# monitor = ,preferred,auto,1

#-------------------------------------------------------------------
# Autostart
#-------------------------------------------------------------------
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = dex -a -s /etc/xdg/autostart/:~/.config/autostart/
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent.service

#-------------------------------------------------------------------
# Input
#-------------------------------------------------------------------
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

#-------------------------------------------------------------------
# General / decoração / animações
#-------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgb(c6a0f6)
    col.inactive_border = rgb(6e738d)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 1.0
    drop_shadow = false
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

gestures {
    workspace_swipe = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#-------------------------------------------------------------------
# Atalhos
#-------------------------------------------------------------------

# arrastar/redimensionar janela flutuante segurando o mod + mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# abrir terminal
bind = $mainMod, RETURN, exec, $term

# fechar janela em foco
bind = $mainMod, Q, killactive,

# launcher de aplicativos
bind = $mainMod, D, exec, rofi -show drun -show-icons

# busca de senhas (requer os pacotes "pass" e "rofi-pass")
bind = $mainMod, P, exec, rofi-pass

# abrir aplicativos específicos
bind = $mainMod SHIFT, T, exec, thunar
bind = $mainMod, Y, exec, $term -e yazi
bind = $mainMod, B, exec, firefox

# mover o foco entre janelas
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# mover a janela em foco
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# alternar a orientação do split do container em foco
bind = $mainMod, T, togglesplit,

# tela cheia
bind = $mainMod, F, fullscreen,

# agrupar janelas em abas (toggle)
bind = $mainMod, W, togglegroup,

# fixar janela em todos os workspaces
bind = $mainMod SHIFT, W, pin,

# alternar entre flutuante/tiled
bind = $mainMod SHIFT, SPACE, togglefloating,

# capturar região da tela
bind = $mainMod SHIFT, S, exec, hyprshot -m region

# trocar de workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# mover a janela em foco para um workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# recarregar a configuração do Hyprland
bind = $mainMod SHIFT, C, exec, hyprctl reload

# menu de logout/desligar/reiniciar
bind = $mainMod SHIFT, E, exec, wlogout -b 5

# modo de redimensionamento com as setas (Enter/Esc pra sair)
bind = $mainMod, R, submap, resize
submap = resize
binde = , left, resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
bind = , return, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# travar a tela
bind = $mainMod, L, exec, hyprlock

# teclas de volume do teclado
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ toggle-mute

#-------------------------------------------------------------------
# Regras de janela
#-------------------------------------------------------------------
windowrulev2 = float, title:^(Calculator)$
windowrulev2 = float, title:^(Timer)$
windowrulev2 = noborder, class:^(firefox)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = center, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = center, class:^(nwg-look)$
windowrulev2 = float, class:^(mpv)$
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(zenity)$
# verifique o app_id real do Thunar em Wayland com `hyprctl clients`
windowrulev2 = float, class:^([Tt]hunar)$
